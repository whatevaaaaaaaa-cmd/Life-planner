<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Planner</title>
<meta name="description" content="A calm daily planner for balance, habits, tasks, journal and money.">
<meta name="theme-color" content="#f5f5fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one calm phone-width column, a landscape that follows the hour at the top of Today, pastel "fields" (sky, sage, mist, rose) naming each area, tab bar at the thumb. */
:root{
  --bg:#f5f5fb; --surface:#ffffff; --surface2:#ebebf6; --ink:#2a2a3d; --muted:#5b5b73; --line:#e2e2ef;
  --sage:#dcf3da; --sage-ink:#2c6b31; --sage-pop:#7dcf7a;
  --sky:#e4e1fd; --sky-ink:#4336b9; --sky-pop:#7566f2;
  --petal:#fde0e9; --petal-ink:#a3315a; --petal-pop:#f887a8;
  --mist:#d4f1e9; --mist-ink:#16695a; --mist-pop:#2bb594;
  --rose:#fde6dc; --rose-ink:#96492f; --rose-pop:#f9b9a3;
  --sun:#fdefc8; --sun-ink:#7a5607; --sun-pop:#fbbf3a;
  --accent:#6b5cf0; --on-accent:#ffffff;
  --shadow:0 12px 32px rgba(90,90,150,.14),0 2px 6px rgba(90,90,150,.07);
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:19px}
.muted{color:var(--muted)} .small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:18px;color:var(--sage-ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.scene{border-radius:24px;overflow:hidden;display:block;width:100%;height:auto}
.hello{display:flex;flex-direction:column;gap:6px}
.line{font-family:var(--display);font-style:italic;color:var(--muted);font-size:17px}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .4s ease}
.note{background:var(--rose);color:var(--rose-ink);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.note div{display:flex;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile b{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.1;display:block;overflow-wrap:anywhere}
.tile span{font-size:14px}
.f-sky{background:var(--sky);color:var(--sky-ink)} .f-sage{background:var(--sage);color:var(--sage-ink)}
.f-mist{background:var(--mist);color:var(--mist-ink)} .f-rose{background:var(--rose);color:var(--rose-ink)}
.f-petal{background:var(--petal);color:var(--petal-ink)}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px}
.row .grow{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.del{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.del:hover{background:var(--petal);color:var(--petal-ink)}
.tag{font-size:13px;color:var(--muted)} .tag.late{color:var(--petal-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px 8px 10px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--sage);color:var(--sage-ink);box-shadow:none}
.chip .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty em{font-family:var(--display);display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;min-height:64px}
.habit{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.habit .hd{display:flex;align-items:center;gap:12px}
.badge{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week.head{padding:0 14px;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.04em;text-transform:uppercase}
.week.head b{display:block;font-size:15px;color:var(--ink);font-weight:500;letter-spacing:0}
.week.head .now b{color:var(--accent);font-weight:600}
.week.dlabels{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;margin-bottom:-2px}
.week.dlabels b{display:block;font-size:14px;color:var(--ink);font-weight:500;letter-spacing:0}
.week.dlabels .now b{color:var(--accent);font-weight:600}
.day{height:36px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:transparent}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.day:disabled{opacity:.4;cursor:default}
.part{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 2px 0}
.entry{padding:14px;display:flex;gap:12px;text-align:left;width:100%;align-items:flex-start}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sum{padding:18px;display:flex;flex-direction:column;gap:14px}
.sum .big{font-family:var(--display);font-size:32px;line-height:1.1;overflow-wrap:anywhere}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{border-radius:14px;padding:10px 12px;min-width:0}
.io b{display:block;font-weight:600;overflow-wrap:anywhere}
.cat{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;font-size:14px}
.cat .bar i{background:var(--rose-ink);opacity:.55}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--sage-ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px 0;min-height:52px}
nav button span{width:52px;height:28px;border-radius:14px;display:grid;place-items:center}
nav button[aria-current="page"]{color:var(--sage-ink);font-weight:600}
nav button[aria-current="page"] span{background:var(--sage)}
.fab{position:fixed;right:max(16px,calc(50% - 260px),env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:21;
  background:var(--accent);color:var(--on-accent);border-radius:20px;height:56px;padding:0 18px 0 14px;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:var(--shadow)}
.veil{position:fixed;inset:0;background:rgba(20,28,29,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;animation:rise .25s ease}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.bar i{transition:none}}
form{display:flex;flex-direction:column;gap:14px}
label,.lbl{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:140px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{flex-direction:row;position:relative}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pick span{min-width:48px;height:48px;padding:0 12px;border-radius:14px;background:var(--surface2);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.pick input:checked+span{background:var(--sage);color:var(--sage-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border-radius:16px;min-height:52px;padding:0 20px;font-weight:600}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.sm{min-height:40px;border-radius:12px;padding:0 14px;font-size:14px}
.btn.warn{background:var(--petal);color:var(--petal-ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap} .acts .btn{flex:1}
.wheel{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.wl{font-size:12px;fill:var(--muted);font-family:var(--body)} .wn{font-size:13px;font-weight:600;fill:var(--ink)}
.bal{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.bal .btn{align-self:stretch}
.slide{display:grid;grid-template-columns:1fr 28px;gap:2px 12px;align-items:center;font-size:15px;color:var(--ink);min-height:44px}
.slide span{grid-column:1/-1;font-weight:600}
.slide input{width:100%;accent-color:var(--accent);min-width:0}
.slide output{text-align:right;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);
  border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:15px}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline;padding:8px}
/* soft pass: round, pillowy, cloud washes instead of straight edges */
body{background:radial-gradient(60% 34% at 0% 0%,color-mix(in srgb,var(--petal) 60%,transparent) 0,transparent 70%),radial-gradient(55% 34% at 100% 22%,color-mix(in srgb,var(--sky) 65%,transparent) 0,transparent 70%),radial-gradient(70% 40% at 25% 100%,color-mix(in srgb,var(--sage) 60%,transparent) 0,transparent 70%),var(--bg)}
h1{font-weight:500}
.line{font-family:var(--body)}
.scene{border-radius:40px}
.card{border-radius:28px}
.card.rows{background:none;box-shadow:none;border-radius:0;display:flex;flex-direction:column;gap:10px}
.rows>*+*{border-top:0}
.rows>*{background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}
.row{padding:10px 12px 10px 16px;min-height:60px}
.tile{border-radius:30px;padding:16px 18px}
.quick button{border-radius:28px}
.note{border-radius:26px;padding:14px 18px}
.btn,.btn.sm,.fab,.day,.pick span,.toast,nav button span{border-radius:999px}
.badge{border-radius:50%}
.day{height:38px}
.bar,.bar i{height:12px;border-radius:999px}
.io div{border-radius:24px;padding:12px 16px}
.sheet{border-radius:40px 40px 0 0}
input[type=text],input[type=number],input[type=date],select,textarea{border-radius:22px;padding:13px 16px;border-width:2px}
.toast{padding-left:20px;bottom:calc(164px + env(safe-area-inset-bottom,0px))}
.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
nav{background:none;border-top:0;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav div{background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:6px 8px}
/* custom drop down in the app's own colours */
.dd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sky);color:var(--sky-ink);border-radius:999px;padding:13px 18px;font-size:16px;font-weight:700;text-align:left;width:100%;min-height:52px}
.dd span{min-width:0;overflow-wrap:anywhere}
.ddlist{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:26px;padding:10px;max-height:300px;overflow:auto}
.ddg{border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;align-self:flex-start;margin-top:8px}
.ddo{text-align:left;padding:10px 14px;border-radius:18px;font-size:15px;color:var(--ink);min-height:44px}
.ddo:hover,.ddo:focus-visible{background:var(--surface)}
/* Puff, the cloud companion */
.hi{display:flex;align-items:center;gap:8px}
.hi .hello{flex:1;min-width:0}
.pal{width:108px;flex:none;border-radius:50%;filter:drop-shadow(0 8px 12px rgba(110,150,160,.3))}
.pal svg{display:block;width:100%;height:auto;animation:bob 3.6s ease-in-out infinite}
.pal .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.pal.hop{animation:hop .6s ease}
.zz{font:600 16px var(--display);fill:var(--sky-ink)}
.bubble{background:var(--surface);border-radius:24px 8px 24px 24px;padding:12px 18px;box-shadow:var(--shadow);align-self:flex-end;max-width:100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%{transform:none}30%{transform:translateY(-16px) scale(1.06,.94)}60%{transform:translateY(0) scale(.95,1.06)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.pal svg,.pal .eyes,.pal.hop{animation:none}}
/* colour pass: brighter family from the reference, round icon buttons with progress rings */
.k-sage{--k:var(--sage-pop);--ki:var(--sage-ink)}.k-petal{--k:var(--petal-pop);--ki:var(--petal-ink)}.k-sun{--k:var(--sun-pop);--ki:var(--sun-ink)}
.k-sky{--k:var(--sky-pop);--ki:var(--sky-ink)}.k-rose{--k:var(--rose-pop);--ki:var(--rose-ink)}.k-mist{--k:var(--mist-pop);--ki:var(--mist-ink)}
.f-sun{background:var(--sun);color:var(--sun-ink)}
.orb{width:52px;height:52px;border-radius:50%;background:var(--k);color:#ffffff;display:grid;place-items:center;flex:none}
.k-sun .orb,.k-rose .orb{color:var(--ki)}
.kards{display:flex;flex-direction:column;gap:10px}
.kard{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);text-align:left;width:100%;min-height:76px}
.kard .grow{flex:1;min-width:0}
.kard b{display:block;font-family:var(--display);font-weight:500;font-size:17px;overflow-wrap:anywhere}
.kard small{font-size:14px;color:var(--muted)}
.kard .go{color:var(--muted);width:52px;display:grid;place-items:center;flex:none}
.ringt{font:700 13px var(--body);fill:var(--ki)}
.quick button{background:none;min-height:0;padding:0;gap:6px;color:var(--ink)}
nav button[aria-current="page"]{color:var(--sky-ink)}
nav button[aria-current="page"] span{background:var(--sky)}
.pick input:checked+span{background:var(--sky);color:var(--sky-ink)}
.chip[aria-pressed="true"]{background:var(--sky);color:var(--sky-ink)}
.brand{color:var(--sky-ink)}
/* the picture space */
.banner{position:relative;border-radius:40px;overflow:hidden}
.banner .scene{border-radius:0}
.banner img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.bact{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.bact .btn{background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;flex-direction:row;font-weight:600;font-size:14px;gap:6px;cursor:pointer;box-shadow:var(--shadow)}
.bact label{position:relative;overflow:hidden}
.filecover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.bact label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
/* 3D icons: a light from the top left, a soft shade underneath, and a coloured shadow below */
.orb,.badge,.chip .dot,.quick .orb{
  background-image:radial-gradient(circle at 32% 24%,rgba(255,255,255,.85) 0,rgba(255,255,255,.25) 26%,rgba(255,255,255,0) 46%),radial-gradient(circle at 50% 118%,rgba(20,20,60,.22) 0,rgba(20,20,60,0) 58%);
  box-shadow:inset 0 -5px 9px rgba(20,20,60,.16),inset 0 3px 6px rgba(255,255,255,.55),0 9px 16px -6px rgba(70,60,140,.45),0 2px 3px rgba(70,60,140,.12);
}
.orb{box-shadow:inset 0 -6px 11px rgba(20,20,60,.18),inset 0 4px 7px rgba(255,255,255,.6),0 10px 18px -6px color-mix(in srgb,var(--k) 85%,#1e1b4b),0 2px 4px rgba(70,60,140,.15)}
.orb svg,.badge svg,.chip .dot svg{stroke-width:2.600;filter:drop-shadow(0 1.500px 1px rgba(20,20,60,.45))}
.k-sun .orb svg,.k-rose .orb svg{filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}
.k-sun .orb{color:#5a3e00}.k-rose .orb{color:#6e2c17}
.tour .orb{box-shadow:inset 0 -10px 18px rgba(20,20,60,.18),inset 0 6px 10px rgba(255,255,255,.6),0 18px 30px -10px color-mix(in srgb,var(--k) 85%,#1e1b4b)}
.check[aria-pressed="true"],.day[aria-pressed="true"],.fab,nav button[aria-current="page"] span{
  background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);
  box-shadow:inset 0 -3px 5px rgba(20,20,60,.18),0 5px 10px -4px rgba(70,60,140,.45);
}
.fab{box-shadow:inset 0 -4px 7px rgba(20,20,60,.2),0 12px 22px -8px rgba(70,60,140,.6)}
.kard .orb{width:56px;height:56px}
/* 3D for every remaining icon */
nav button span.nb{width:40px;height:40px;border-radius:50%;background-color:var(--k);color:#ffffff;
  background-image:radial-gradient(circle at 32% 24%,rgba(255,255,255,.85) 0,rgba(255,255,255,.2) 28%,rgba(255,255,255,0) 48%),radial-gradient(circle at 50% 118%,rgba(20,20,60,.22) 0,rgba(20,20,60,0) 58%);
  box-shadow:inset 0 -4px 7px rgba(20,20,60,.16),inset 0 3px 5px rgba(255,255,255,.55),0 6px 10px -4px color-mix(in srgb,var(--k) 85%,#1e1b4b);
  opacity:.6;transform:scale(.88);transition:transform .2s,opacity .2s}
nav button span.nb svg{stroke-width:2.400;filter:drop-shadow(0 1.500px 1px rgba(20,20,60,.4))}

ou vir jou wag.", "Engeza okudingeka ukwenze, nosuku lokugcina uma uthanda. Ikhasi elithi Namuhla likhombisa kuphela okukulindile manje."], "Journal and money": ["Joernaal en geld", "Idayari nemali"], "Write a few honest lines and choose the weather inside. Note what comes in and goes out. Money totals only appear on the Money page.": ["Skryf 'n paar eerlike reëls en kies die weer binne-in jou. Teken aan wat inkom en uitgaan. Geldtotale verskyn net op die Geld-blad.", "Bhala imigqa embalwa eqotho bese ukhetha isimo sezulu sangaphakathi. Bhala imali engenayo nephumayo. Izingqikithi zemali zivela kuphela ekhasini elithi Imali."], "Finding your way": ["Jou pad vind", "Ukuthola indlela"], "Use the bar at the bottom to move between Today, Tasks, Habits, Journal and Money. The button at the bottom right of each section adds something new. Settings live behind the gear at the top.": ["Gebruik die balk onderaan om tussen Vandag, Take, Gewoontes, Joernaal en Geld te beweeg. Die knoppie regs onder in elke afdeling voeg iets nuuts by. Instellings is agter die rat bo.", "Sebenzisa ibha engezansi ukuhamba phakathi kokuthi Namuhla, Imisebenzi, Imikhuba, Idayari ne-Imali. Inkinobho engezansi ngakwesokudla engxenyeni ngayinye yengeza okusha. Izilungiselelo zingemuva kwegiya phezulu."], "Make it yours": ["Maak dit joune", "Kwenze kube ngokwakho"], "Add a picture that means something to you on the front page. The example entries show how things look, so tap Start fresh when you are ready. What you add is private to you.": ["Voeg 'n prent by wat vir jou iets beteken op die voorblad. Die voorbeeldinskrywings wys hoe dinge lyk, so tik Begin van voor af wanneer jy gereed is. Wat jy byvoeg, is privaat vir jou.", "Engeza isithombe esinencazelo kuwe ekhasini lokuqala. Izibonelo zikhombisa ukuthi izinto zibukeka kanjani, ngakho thepha u-Qala kabusha uma usulungile. Okufakayo kungokwakho wedwa."], "A river reaches the sea one bend at a time.": ["'n Rivier bereik die see een draai op 'n slag." /* saving: this device first, then the viewer's private account space */
var ref=null,remoteReady=false,writing=false,dirty=false,blocked=false,retries=0,wt=null,sync="device";
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  queueWrite();
}
function queueWrite(){if(!ref||!remoteReady||blocked)return;clearTimeout(wt);wt=setTimeout(flush,1200);}
function flush(){
  if(writing){dirty=true;return;}
  writing=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){retries=0;sync="account";},function(e){
    if(e&&e.code==="unavailable"&&retries<3){retries++;dirty=true;}else{blocked=true;sync="device";}
  }).then(function(){writing=false;if(dirty&&!blocked){clearTimeout(wt);wt=setTimeout(flush,3000);}});
}
function connect(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      ref=db.doc("data/users/"+id+"/planner");
      pref=db.doc("data/users/"+id+"/photo");
      pref.get().then(function(ps){
        var d=ps.exists?ps.data():null,la=photo?photo.at||0:0;
        if(d&&typeof d.data==="string"&&(d.at||0)>la){photo={at:d.at,data:d.data};try{localStorage.setItem(KEY+"-photo",JSON.stringify(photo));}catch(e){}render();}
        else if(photo&&la>(d&&d.at||0))pref.set({at:photo.at,data:photo.data}).catch(function(){});
      }).catch(function(){});
      var slow=setTimeout(function(){if(!remoteReady)sync="waiting";},10000);
      ref.onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites)return;
        var d=snap.exists?snap.data():null,at=d&&d.updatedAt||0;
        if(d&&valid(d)&&at>S.updatedAt){S=JSON.parse(JSON.stringify(d));try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();}
        if(!snap.metadata.fromCache&&!remoteReady){
          clearTimeout(slow);remoteReady=true;sync="account";
          if(S.updatedAt>at&&S.updatedAt>0)queueWrite();
        }
      },function(){clearTimeout(slow);blocked=true;sync="device";});
    });
  }).catch(function(){});
}

function readPhoto(file){
  var fr=new FileReader();
  fr.onerror=function(){toast(T("That file could not be read. Try another picture."));};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){toast(T("That file could not be opened as a picture. Try a JPG or PNG."));};
    img.onload=function(){
      try{
        var k=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        var q=0.800,d=c.toDataURL("image/jpeg",q);while(d.length>170000&&q>0.350){q-=0.100;d=c.toDataURL("image/jpeg",q);}
        if(d.indexOf("data:image/")!==0||d.length>230000){toast(T("That picture is too large to keep. Try a smaller one."));return;}
        setPhoto(d);toast(T("Picture added."));
      }catch(e){toast(T("The picture could not be prepared. Try another one."));}
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function palLines(){

  if(!S.wheel||!S.wheel.scores||!S.wheel.scores[AREAS[0][0]])a.push(T("Shall we start with your balance wheel?"));
  if(ht&&hd===ht)a.push(T("Every habit tended today. I am doing a happy float."));
  else if(ht)a.push(T(ht-hd===1?"{n} habit is still waiting. No rush, one at a time.":"{n} habits are still waiting. No rush, one at a time.",{n:ht-hd}));
  var n=S.tasks.filter(function(t){return !t.done&&(!t.due||t.due<=td);}).length;

function placePuff(){
  puffRaf=0;var el=$("puff");if(!el)return;
  var secs=[].slice.call(document.querySelectorAll("#app [data-puff]"));if(!secs.length){el.hidden=true;hideSay();return;}el.hidden=false;
  var lim=12,H=window.innerHeight,pick=null,top=lim,i,r;
  for(i=0;i<secs.length;i++){r=secs[i].getBoundingClientRect();if(r.top>=lim&&r.top<=H-230){pick=secs[i];top=r.top-8;break;}}
  if(!pick){for(i=secs.length-1;i>=0;i--){if(secs[i].getBoundingClientRect().top<lim){pick=secs[i];break;}}pick=pick||secs[0];top=lim;}
  top=Math.max(lim,Math.min(top,H-210));el.style.top=top+"px";
  var k=pick.getAttribute("data-puff");if(k!==puffKey){puffKey=k;hideSay();}
  var x=$("puffsay");if(!x.hidden)x.style.top=(top+10)+"px";

function popSound(){
  if(S.sound===false)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();

    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.13);
  }catch(e){}
}
function gameBubbles(cv){
  var ctx=cv.getContext("2d"),W=cv.width,H=cv.height,cols=["#f9b9a3","#fde0e9","#d4f1e9","#e4e1fd","#fdefc8","#dcf3da"],B=[],st={raf:0};
  function make(y){return {x:20+Math.random()*(W-40),y:y===undefined?H+30:y,r:16+Math.random()*16,v:0.2+Math.random()*0.3,c:cols[(Math.random()*cols.length)|0],w:Math.random()*6.28};}
  for(var i=0;i<9;i++)B.push(make(Math.random()*H));
  function frame(){
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#f5f5fb");g.addColorStop(1,"#e4e1fd");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    B.forEach(function(b,i){b.y-=b.v;b.w+=0.015;b.x+=Math.sin(b.w)*0.25;if(b.y<-b.r-20)B[i]=make();var q=B[i];
      ctx.globalAlpha=0.78;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.fillStyle=q.c;ctx.fill();ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(q.x-q.r*0.35,q.y-q.r*0.35,q.r*0.22,0,6.283);ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill();});
    st.raf=requestAnimationFrame(frame);
  }
  cv.onpointerdown=function(e){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
    for(var i=B.length-1;i>=0;i--){var b=B[i];if(Math.hypot(b.x-x,b.y-y)<b.r+6){B[i]=make();popSound();break;}}};
  frame();

}
function gameSand(cv){
  var ctx=cv.getContext("2d"),W=cv.width,H=cv.height,down=false,lx=0,ly=0;
  function smooth(){ctx.fillStyle="#f3ead8";ctx.fillRect(0,0,W,H);}
  function at(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
  smooth();

  cv.onpointermove=function(e){if(!down)return;var p=at(e);ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p[0],p[1]);ctx.lineWidth=3;ctx.strokeStyle="rgba(150,128,96,.22)";ctx.stroke();

}
function gamePairs(root){
